[package]
name = "eon-capability"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
portable-pty-allocator = ["dep:portable-pty", "rustix/net"]

[[bin]]
name = "eon-pty-allocator"
path = "src/pty/allocator/main.rs"
required-features = ["portable-pty-allocator"]

[dependencies]
blake3 = "1"
eon-cyber = { path = "../eon-cyber", default-features = false }
eon-foundation = { version = "0.1.0", path = "../eon-foundation" }
eon-primitives = { path = "../eon-primitives" }
getrandom = "0.3"
html5gum = { version = "0.9.2", default-features = false }
landlock = "0.4"
libc = "0.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
seccompiler = "0.5"
serde_json = "1"
wasmtime = "50"
webpki-root-certs = "1.0.12"

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
rustix = { version = "1.1.6", features = ["fs", "process"] }
sha2 = "0.10.9"
tree-sitter = "0.27"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23.2"

[target.'cfg(all(target_os = "linux", target_env = "gnu", target_arch = "x86_64"))'.dependencies]
portable-pty = { version = "=0.9.0", optional = true, default-features = false }

[dev-dependencies]
proptest = "1"
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std"] }
tokio = { version = "1.54.1", features = ["rt", "net", "time"] }
