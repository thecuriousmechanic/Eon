[package]
name = "eon-uniffi"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
# Keep `cargo run --bin uniffi-bindgen` working on the host. Android opts out of host tooling.
default = ["bindgen-cli"]
profile-mobile-edge = []
bindgen-cli = ["uniffi/cli", "uniffi/cargo-metadata"]

[dependencies]
eon-kernel = { path = "../eon-kernel", default-features = false }
eon-primitives = { path = "../eon-primitives" }
eon-voice = { path = "../eon-voice", default-features = false }
eon-cognition = { path = "../eon-cognition", default-features = false }
serde_json = "1"
uniffi = { version = "0.29", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
eon-foundation = { path = "../eon-foundation" }
jni = "0.21.1"

[build-dependencies]
uniffi = { version = "0.29", default-features = false, features = ["build"] }

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen-cli"]
