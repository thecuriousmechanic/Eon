[package]
name = "eon-cyber"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = ["solver"]
solver = ["dep:z3"]
self-fsync-ebpf = ["dep:eon-ebpf"]
self-cpu-ebpf = ["dep:cc"]

[build-dependencies]
cc = { version = "1.11.1", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
eon-ebpf = { path = "../eon-ebpf", optional = true, default-features = false, features = ["self-fsync"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Diagnostics_Etw"] }

[dependencies]
eon-primitives = { path = "../eon-primitives" }
petgraph = "0.8"
serde_json = "1"
tree-sitter = "0.27"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23.2"
z3 = { version = "0.23", features = ["bundled"], optional = true }
